name: Build Steam item images

on:
  push:
    branches:
      - main
    paths:
      - "**/items-source/*.icon.png"
      - ".github/workflows/pad-item-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Generate Steam image sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          ROOT = Path(".")
          TARGETS = (
              ("icon.png", 200),
              ("large.png", 2048),
          )

          generated = 0

          for source_path in sorted(ROOT.glob("*/items-source/*.icon.png")):
              item_id = source_path.name[: -len(".icon.png")]
              item_dir = source_path.parent.parent / "items" / item_id
              item_dir.mkdir(parents=True, exist_ok=True)

              with Image.open(source_path) as opened:
                  image = opened.convert("RGBA")

              for output_name, target_size in TARGETS:
                  if image.width > target_size or image.height > target_size:
                      ratio = min(target_size / image.width, target_size / image.height)
                      width = max(1, min(target_size, round(image.width * ratio)))
                      height = max(1, min(target_size, round(image.height * ratio)))
                      resized = image.resize((width, height), Image.LANCZOS)
                  else:
                      scale = min(target_size // image.width, target_size // image.height)
                      width = image.width * scale
                      height = image.height * scale
                      resized = image.resize((width, height), Image.NEAREST)

                  canvas = Image.new("RGBA", (target_size, target_size), (0, 0, 0, 0))
                  canvas.paste(
                      resized,
                      ((target_size - width) // 2, (target_size - height) // 2),
                      resized,
                  )

                  output_path = item_dir / output_name
                  canvas.save(output_path, optimize=True)
                  generated += 1
                  print(f"Generated {output_path} from {source_path}")

          if generated == 0:
              print("No source images found.")
          PY

      - name: Commit generated images
        run: |
          git add .

          if git diff --cached --quiet --exit-code; then
            echo "No generated image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Steam item images"
          git push
